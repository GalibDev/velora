services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    container_name: velora-cobalt
    init: true
    read_only: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      API_URL: "http://localhost:9000/"
      YOUTUBE_SESSION_SERVER: "http://yt-session-generator:4416/"
      YOUTUBE_SESSION_INNERTUBE_CLIENT: "WEB_EMBEDDED"
    depends_on:
      - yt-session-generator

  yt-session-generator:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: velora-yt-session
    init: true
    restart: unless-stopped
